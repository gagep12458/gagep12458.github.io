<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Document</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font:16px Arial}body{background:#fff}#menu,#play{display:none;position:fixed;inset:0;background:#111a26;color:white}#menu{align-items:center;justify-content:center}.panel{background:#1d2939;padding:28px;border-radius:16px;width:min(620px,94vw)}h1{text-align:center}.grid{display:grid;grid-template-columns:1fr;gap:12px}button{background:#2b4059;color:white;border:1px solid #60748d;border-radius:10px;padding:14px;font-size:16px}.tile{font-size:20px;font-weight:bold;min-height:75px}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.top{position:absolute;z-index:2;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.hud{background:#172438dd;border-radius:8px;padding:11px;color:#fff}.controls{position:absolute;z-index:2;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.controls button{min-width:68px;height:58px;touch-action:none}.hint{position:absolute;bottom:78px;width:100%;text-align:center;color:#eee;pointer-events:none}</style></head><body><div id="menu"><div class="panel"><h1>Games</h1><div class="grid"><button class="tile" id="start">Stunt Truck</button></div></div></div><div id="play"><canvas id="cv"></canvas><div class="top"><button id="back">Back</button><div id="hud" class="hud"></div></div><div class="hint">WASD or arrows: accelerate, brake/reverse, steer. Keep the truck level to land cleanly.</div><div id="controls" class="controls"></div></div><script>(()=>{'use strict';const menu=document.querySelector('#menu'),play=document.querySelector('#play'),cv=document.querySelector('#cv'),c=cv.getContext('2d'),hud=document.querySelector('#hud'),controls=document.querySelector('#controls');let unlocked=false,active=false,raf=0,cleanup=null;function resize(){ const V=(x,y,z)=>({x,y,z}),sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z),dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);function project(p){let f=Math.min(innerWidth,innerHeight)*.85,z=Math.max(.1,p.z);return{x:innerWidth/2+p.x*f/z,y:innerHeight/2-p.y*f/z,z}}function polygons(fs){fs.map(o=>{let n=cross(sub(o.p[1],o.p[0]),sub(o.p[2],o.p[0]));if(dot(n,o.p[0])>=0)return null;let q=o.p.map(project);if(q.some(a=>a.z<.1))return null;return{q,col:o.col,depth:q.reduce((s,a)=>s+a.z,0)/q.length}}).filter(Boolean).sort((a,b)=>b.depth-a.depth).forEach(o=>{c.beginPath();c.moveTo(o.q[0].x,o.q[0].y);o.q.slice(1).forEach(p=>c.lineTo(p.x,p.y));c.closePath();c.fillStyle=o.col;c.fill();c.strokeStyle='#18202a';c.stroke()})}function cube(x,y,z,a,b,d,col){let p=[V(x-a,y-b,z-d),V(x+a,y-b,z-d),V(x+a,y+b,z-d),V(x-a,y+b,z-d),V(x-a,y-b,z+d),V(x+a,y-b,z+d),V(x+a,y+b,z+d),V(x-a,y+b,z+d)];return[[0,3,2,1],[4,5,6,7],[0,1,5,4],[3,7,6,2],[0,4,7,3],[1,2,6,5]].map(ix=>({p:ix.map(i=>p[i]),col}))}
let code=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'],ix=0,corners=[];function unlock(){if(unlocked)return;unlocked=true;menu.style.display='flex'}document.addEventListener('keydown',e=>{if(!unlocked){let k=e.key.length===1?e.key.toLowerCase():e.key;ix=k===code[ix]?ix+1:k===code[0]?1:0;if(ix===code.length)unlock()}if(e.key==='Escape'&&active){close();menu.style.display='none';unlocked=false;ix=0;corners=[]}});document.addEventListener('touchstart',e=>{if(unlocked)return;let t=e.changedTouches[0],x=t.clientX/innerWidth,y=t.clientY/innerHeight,q=.12,n=x<q&&y<q?0:x>1-q&&y<q?1:x<q&&y>1-q?2:x>1-q&&y>1-q?3:-1;if(n>=0){corners.push(n);corners=corners.slice(-4);if(corners.join('')==='0123')unlock()}},{passive:true});document.querySelector('#start').onclick=open;document.querySelector('#back').onclick=close;

let w=innerWidth,h=innerHeight;c.fillStyle='#8cc4e6';c.fillRect(0,0,w,h*.57);c.fillStyle='#d6e4df';c.fillRect(0,h*.57,w,h*.43);let gy=ground(dist),camZ=dist-9,camY=gy+4+air,fs=[];for(let i=-2;i<20;i++){let z=dist+i*3,y=ground(z),zz=z-camZ;fs.push({p:[V(-7-x,y-camY,zz),V(7-x,y-camY,zz),V(7-x,y-1.2-camY,zz),V(-7-x,y-1.2-camY,zz)],col:i%2?'#5d854f':'#6c9759'});for(let l of [-1,1])fs.push({p:[V(l-.045-x,y+.02-camY,zz),V(l+.045-x,y+.02-camY,zz),V(l+.045-x,y+.02-camY,zz+2),V(l-.045-x,y+.02-camY,zz+2)],col:'#d8c681'})}polygons(fs);let ty=gy+(air?air*.8:0)+.15,tz=5,tx=-x,truck=[...cube(tx,ty+.58,tz,.9,.34,1.27,'#d44932'),...cube(tx,ty+1.03,tz-.34,.51,.29,.59,'#f07b47'),...cube(tx,ty+1.05,tz-.34,.37,.19,.42,'#83c1d3')];polygons(truck);for(let wx of [-.68,.68])for(let zz of [4.15,5.85]){let p=project(V(tx+wx,ty+.16,tz+zz-5));c.beginPath();c.arc(p.x,p.y,Math.max(5,13/p.z),0,7);c.fillStyle='#20242a';c.fill();c.strokeStyle='#b7c2cb';c.lineWidth=2;c.stroke()}let score=Math.floor(dist*2)+bonus;hud.textContent=`Speed ${Math.round(Math.abs(speed)*200)} km/h  |  Distance ${Math.floor(dist)} m  |  Score ${score}${air?'  |  AIR '+(airTime/60).toFixed(1)+'s':''}`;if(dead){c.fillStyle='#07101baa';c.fillRect(0,0,w,h);c.fillStyle='white';c.textAlign='center';c.font='bold 30px Arial';c.fillText('CRASHED — press R to restart',w/2,h/2)}raf=requestAnimationFrame(draw)}reset();draw();cleanup=()=>{removeEventListener('keydown',kd);removeEventListener('keyup',ku);controls.innerHTML='';cancelAnimationFrame(raf)}}})();</script></body></html>
