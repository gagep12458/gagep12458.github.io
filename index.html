<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Gage</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0d1117;
      --surface: #131a23;
      --text: #e6edf3;
      --muted: #9aa7b5;
      --accent: #70d6a2;
      --border: #263240;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100% - 40px, 680px);
      margin: auto;
      padding: 80px 0;
    }

    .intro { margin-bottom: 52px; }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(3.5rem, 12vw, 5.5rem);
      line-height: 1;
      letter-spacing: -0.065em;
      font-weight: 750;
    }

    .tagline {
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 3vw, 1.2rem);
      line-height: 1.6;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--accent);
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    li {
      padding: 18px 20px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      font-size: 1rem;
      line-height: 1.45;
    }

    footer {
      padding: 22px 20px 26px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }

    @media (max-width: 480px) {
      main { width: min(100% - 36px, 680px); padding: 64px 0; }
      .intro { margin-bottom: 40px; }
      li { padding: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <h1>Gage</h1>
      <p class="tagline">tech repair, game mods, and tutorials</p>
    </header>

    <section aria-labelledby="what-i-do">
      <h2 id="what-i-do">What I do</h2>
      <ul>
        <li>PS4 / console repair</li>
        <li>game mods</li>
        <li>how-to tutorials</li>
      </ul>
    </section>
  </main>

  <footer>gagep12458</footer>
</body>
</html>
